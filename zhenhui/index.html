<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臻辉班｜班级纪念册留言墙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f9f4e8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #222244;
            line-height: 1.65;
        }
        .header-badges {
            display: flex;
            justify-content: center;
            gap:12px;
            padding:24px 12px 8px;
            flex-wrap: wrap;
        }
        .badge-tag{
            border:1px solid #d4b46e;
            color:#947842;
            padding:6px 18px;
            border-radius:999px;
            font-size:15px;
        }
        .page-header{
            text-align:center;
            padding:30px 16px 20px;
        }
        .page-header .en-title{
            font-size:15px;
            color:#998e7c;
            letter-spacing:4px;
        }
        .page-header h1{
            font-size:34px;
            margin:8px 0 4px;
            color:#202040;
        }
        .page-header .sub-title{
            color:#888070;
            font-size:16px;
        }
        .container{
            max-width: 920px;
            margin:0 auto;
            padding:0 16px;
        }
        .wall-title{
            text-align:center;
            font-size:22px;
            margin-bottom:4px;
        }
        .wall-sub{
            text-align:center;
            color:#888070;
            margin-bottom:12px;
        }

        /* 留言墙容器：min‑height小幅加高 */
        .msg-wall{
            background:#faf6ec;
            border-radius:16px;
            padding:20px;
            min-height:420px;
        }
        /* 流式垂直列表，消除absolute漂浮重叠bug */
        .msg-list{
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .msg-item{
            background:#fff8e8;
            border:1px solid #e2d4b8;
            border-radius:12px;
            padding:12px 16px;
        }
        .msg-empty{
            text-align:center;
            color:#999;
            padding:80px 0;
        }

        /* 输入区域：已经放在留言墙下方 */
        .input-area{
            margin-top:18px;
            display:flex;
            gap:12px;
        }
        .input-area input{
            flex:1;
            padding:14px 16px;
            border:1px solid #d4c2a3;
            border-radius:10px;
            font-size:16px;
            background:#fff;
        }
        .input-area button{
            padding:0 26px;
            background:#d4b46e;
            color:#ffffff;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            white-space:nowrap;
        }
        .input-area button:disabled{
            opacity:0.65;
            cursor:not-allowed;
        }

        /* 页脚版权样式 */
        footer{
            text-align:center;
            color:#999999;
            font-size:14px;
            padding:40px 16px 30px;
        }

        /* 手机端适配：小屏幕按钮换行 */
        @media(max-width:600px){
            .input-area{
                flex-direction:column;
            }
            .input-area button{
                padding:12px;
            }
            .page-header h1{
                font-size:28px;
            }
        }

        /* 返回顶部按钮 */
        #backTop{
            position:fixed;
            right:20px;
            bottom:24px;
            width:48px;
            height:48px;
            border-radius:50%;
            background:#d4b46e;
            color:#fff;
            border:none;
            font-size:20px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="header-badges">
        <div class="badge-tag">少年逐梦</div>
        <div class="badge-tag">未来可期</div>
        <div class="badge-tag">岁岁平安</div>
    </div>

    <div class="page-header">
        <div class="en-title">MEMORY</div>
        <h1>臻辉班</h1>
        <div class="sub-title">属于我们的时光</div>
    </div>

    <div class="container">
        <h3 class="wall-title">班级留言墙</h3>
        <p class="wall-sub">写下你的回忆与祝福</p>

        <!-- 留言展示区域在上 -->
        <div class="msg-wall">
            <div class="msg-list" id="msgList">
                <div class="msg-empty" id="emptyTip">还没有留言，来写下第一条祝福✨</div>
            </div>
        </div>

        <!-- 输入框+发布按钮，移到留言墙下方 -->
        <div class="input-area">
            <input id="msgInput" placeholder="请输入留言内容...">
            <button id="submitBtn">发布留言</button>
        </div>
    </div>

    <!-- 新增底部版权页脚 -->
    <footer>
        Copyright © 2026 UDTOOL工具箱. All Rights Reserved.
    </footer>

    <button id="backTop">↑</button>

<script>
const msgList = document.getElementById('msgList');
const msgInput = document.getElementById('msgInput');
const submitBtn = document.getElementById('submitBtn');
const backTopBtn = document.getElementById('backTop');
const API_URL = "/api/messages";

//加载留言
async function loadMessages(){
    try{
        const res = await fetch(API_URL);
        const arr = await res.json();
        msgList.innerHTML = "";
        if(!Array.isArray(arr) || arr.length === 0){
            msgList.innerHTML = `<div class="msg-empty">还没有留言，来写下第一条祝福✨</div>`;
            return;
        }
        arr.forEach(item=>{
            const div = document.createElement('div');
            div.className = "msg-item";
            div.innerText = item.content;
            msgList.appendChild(div);
        })
    }catch(e){
        console.error("加载留言异常",e);
    }
}

//提交留言
async function submitMessage() {
    const text = msgInput.value.trim();
    if(!text){
        msgInput.style.borderColor="#e74c3c";
        setTimeout(()=>msgInput.style.borderColor="#d4c2a3",1200);
        return;
    }
    submitBtn.disabled = true;
    submitBtn.innerText = "提交中...";
    try{
        const res = await fetch(API_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({content:text})
        })
        const ret = await res.json();
        if(!res.ok) throw new Error(ret.error || "提交失败");
        msgInput.value = "";
        await loadMessages();
        alert("留言发布成功！");
    }catch(e){
        alert("发布失败："+e.message);
    }finally{
        submitBtn.disabled = false;
        submitBtn.innerText = "发布留言";
    }
}

submitBtn.addEventListener('click',submitMessage);
msgInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter') submitMessage();
})

//返回顶部
backTopBtn.addEventListener('click',()=>{
    window.scrollTo({top:0,behavior:'smooth'});
})

window.onload = loadMessages;
</script>
</body>
</html>
